name: Deploy Frontend

# Automatically deploys the dev frontend when vestra/ changes land on main.
# Use workflow_dispatch to manually target gamma or live.
#
# Prerequisites (one-time setup per environment):
#   1. Create an Azure service principal with Contributor access to the subscription.
#   2. Add a federated credential per environment (subject: repo:ekaag/robe.ai:environment:<name>).
#   3. In GitHub → Settings → Environments, create environments named "dev", "gamma", "live".
#      Each environment needs these secrets:
#        AZURE_CLIENT_ID       — the app registration client ID
#        AZURE_TENANT_ID       — your Entra tenant ID
#        AZURE_SUBSCRIPTION_ID — the Azure subscription ID
#      And optionally these variables (leave empty on dev to use FakeAuthProvider):
#        FRONTEND_ENTRA_AUTHORITY  — e.g. https://vestraoauth.ciamlogin.com/...
#        FRONTEND_ENTRA_CLIENT_ID  — e.g. d4cd6bf9-...
#        FRONTEND_ENTRA_API_SCOPE  — e.g. api://d4cd6bf9-.../access_as_user

on:
  push:
    branches: [main]
    paths:
      - 'vestra/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:
    inputs:
      stage:
        description: 'Target stage'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - gamma
          - live

# One deploy per stage at a time — no parallel deploys to the same SWA.
concurrency:
  group: deploy-frontend-${{ github.event.inputs.stage || 'dev' }}
  cancel-in-progress: false

permissions:
  id-token: write  # required for OIDC token exchange with Azure
  contents: read

jobs:
  deploy:
    name: Deploy ${{ github.event.inputs.stage || 'dev' }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.stage || 'dev' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Resolve stage config
        id: cfg
        run: |
          STAGE="${{ github.event.inputs.stage || 'dev' }}"
          SWA_NAME="swa-robe-${STAGE}"
          RG="rg-robe-${STAGE}"
          APP_URL="https://app-robe-${STAGE}.azurewebsites.net"
          HOSTNAME=$(az staticwebapp show --name "$SWA_NAME" --resource-group "$RG" \
            --query defaultHostname -o tsv)
          TOKEN=$(az staticwebapp secrets list --name "$SWA_NAME" --resource-group "$RG" \
            --query "properties.apiKey" -o tsv)
          echo "hostname=$HOSTNAME"   >> $GITHUB_OUTPUT
          echo "token=$TOKEN"         >> $GITHUB_OUTPUT
          echo "app_url=$APP_URL"     >> $GITHUB_OUTPUT

      - name: Build Next.js
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ steps.cfg.outputs.app_url }}
          NEXT_PUBLIC_ENTRA_REDIRECT_URI: https://${{ steps.cfg.outputs.hostname }}/auth/blank
          NEXT_PUBLIC_ENTRA_AUTHORITY: ${{ vars.FRONTEND_ENTRA_AUTHORITY }}
          NEXT_PUBLIC_ENTRA_CLIENT_ID: ${{ vars.FRONTEND_ENTRA_CLIENT_ID }}
          NEXT_PUBLIC_ENTRA_API_SCOPE: ${{ vars.FRONTEND_ENTRA_API_SCOPE }}
        run: |
          cd vestra
          pnpm install --frozen-lockfile
          pnpm --filter @vestra/web run build

      - name: Deploy to Azure SWA
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.cfg.outputs.token }}
          action: upload
          app_location: vestra/apps/web
          output_location: .next
          skip_app_build: true
          skip_api_build: true
